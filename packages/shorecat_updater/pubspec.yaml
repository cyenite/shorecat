name: shorecat_updater
description: Pure Dart shorecat updater - patch checks, verified downloads, delta install, boot breadcrumbs and crash rollback.
version: 0.1.0
repository: https://github.com/cyenite/shorecat
issue_tracker: https://github.com/cyenite/shorecat/issues
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  archive: ^4.0.2
  shorecat_core: ^0.1.0

dev_dependencies:
  path: ^1.9.0
  shorecat_server: ^0.1.0
  test: ^1.25.6
