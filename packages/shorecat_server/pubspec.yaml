version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.0

executables:
  shorecat_server:

dependencies:
  args: ^2.6.0
  crypto: ^3.0.6
  path: ^1.9.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_static: ^1.1.3
  shorecat_core:
    path: ../shorecat_core

dev_dependencies:
  test: ^1.25.6
