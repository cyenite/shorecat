services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      SHORECAT_PUBLIC_URL: ${SHORECAT_PUBLIC_URL:?Set an HTTPS origin in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      shorecat:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
