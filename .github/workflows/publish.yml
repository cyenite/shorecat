name: Publish Dart package

on:
  push:
    tags:
      - 'shorecat_*-v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.5'
      - name: Stage standalone package
        shell: bash
        run: |
          package="${GITHUB_REF_NAME%-v*}"
          version="${GITHUB_REF_NAME##*-v}"
          bash tool/stage-package.sh "$package" "$RUNNER_TEMP/package"
          grep -qx "version: $version" "$RUNNER_TEMP/package/pubspec.yaml"
      - name: Validate and publish
        shell: bash
        run: |
          cd "$RUNNER_TEMP/package"
          if [[ "$GITHUB_REF_NAME" == shorecat_code_push-* ]]; then
            runner=flutter
          else
            runner=dart
          fi
          "$runner" pub get
          "$runner" analyze
          "$runner" test
          "$runner" pub publish --dry-run
          "$runner" pub publish --force
